# Fixed project name so every checkout/worktree shares the same containers and volumes.
name: lexica

services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - '6333:6333'
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # CPU only: no GPU reservation, models run on the host CPU.
  ollama:
    image: ollama/ollama:0.40.18
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
